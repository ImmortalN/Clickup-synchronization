name: ClickUp Intercom Sync Bot

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Какой скрипт запускать'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - delete_guides
          - migrate_snippet

      clickup_task_id:
        description: 'ID задач ClickUp (один или несколько через запятую)'
        required: false
        default: ''

      folder_id:
        description: 'ID папки (для sync_bot.py)'
        required: false
        default: ''

      article_ids:
        description: 'ID статей через запятую (для sync_bot.py)'
        required: false
        default: ''

  schedule:
    - cron: '0 0 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests markdown python-dotenv beautifulsoup4 lxml

      # ==============================
      # SYNC BOT
      # ==============================
      - name: Run sync bot
        id: sync
        if: github.event.inputs.script == 'sync' || github.event_name == 'schedule'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          python sync_bot.py \
            "${{ github.event.inputs.folder_id }}" \
            "${{ github.event.inputs.article_ids }}" \
            "${{ github.event.inputs.clickup_task_id }}" \
            2>&1 | tee sync.log

      # ==============================
      # DELETE INTERNAL GUIDES
      # ==============================
      - name: Delete internal guides
        if: github.event.inputs.script == 'delete_guides'
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
        run: |
          python delete_internal_guides.py 2>&1 | tee sync.log

      # ==============================
      # MIGRATE SNIPPET
      # ==============================
      - name: Migrate snippet to guide
        if: github.event.inputs.script == 'migrate_snippet'
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
        run: |
          python migrate_snippet_to_guide.py 2>&1 | tee sync.log

      # Определяем: пропуск из-за нечётной недели (письмо не нужно)
      - name: Detect week skip
        id: week_skip
        if: always() && github.event_name == 'schedule'
        run: |
          if [ -f sync.log ] && grep -q "нечетная неделя" sync.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Odd week — email will be skipped"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ==============================
      # SEND EMAIL — только автозапуск, и только если синк реально шёл
      # ==============================
      - name: Send mail
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.week_skip.outputs.skipped != 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Intercom Sync Report (${{ github.run_id }})
          to: immortal@jetmonsters.me
          from: GitHub Actions Sync <${{ secrets.MAIL_USERNAME }}>
          body: |
            Автоматическая синхронизация завершена.
            Статус: ${{ job.status }}

            Логи во вложении.
          attachments: sync.log
