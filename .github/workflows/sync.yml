name: ClickUp Intercom Sync Bot

on:
  # 1 и 3: Ручной запуск (с кнопкой и вводом папки)
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'ID папки Intercom (оставьте пустым для стандартной 4101985)'
        required: false
        default: ''

  # 2: Автоматически каждую субботу в 00:00 UTC
  schedule:
    - cron: '0 0 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests markdown python-dotenv beautifulsoup4 lxml

      - name: Run script
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
        run: |
          # Запускаем скрипт, передавая ID папки из инпута (если он есть)
          python sync_bot.py "${{ github.event.inputs.folder_id }}"
