name: ClickUp Intercom Sync Bot

on:
  # 1, 3 и 4: Ручной запуск с выбором параметров
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'ID папки (Варианты 1-3). Оставьте пустым для папки по умолчанию'
        required: false
        default: ''
      article_ids:
        description: 'ID статей через запятую (Вариант 4). Если заполнено, folder_id игнорируется'
        required: false
        default: ''

  # 2: Автоматически каждую субботу в 00:00 UTC
  schedule:
    - cron: '0 0 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests markdown python-dotenv beautifulsoup4 lxml

      - name: Run script
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
        run: |
          # Теперь мы передаем два аргумента: ID папки и ID статей
          python sync_bot.py "${{ github.event.inputs.folder_id }}" "${{ github.event.inputs.article_ids }}"
