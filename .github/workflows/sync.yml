name: ClickUp Intercom Sync Bot

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'ID папки (Варианты 1-3)'
        required: false
        default: ''
      article_ids:
        description: 'ID статей через запятую (Вариант 4)'
        required: false
        default: ''

  schedule:
    # Запускаем каждую субботу (проверка "раз в 2 недели" теперь внутри Python)
    - cron: '0 0 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests markdown python-dotenv beautifulsoup4 lxml

      - name: Run script and save log
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
        run: |
          # Запускаем и записываем всё (и ошибки, и инфо) в файл sync.log
          python sync_bot.py "${{ github.event.inputs.folder_id }}" "${{ github.event.inputs.article_ids }}" 2>&1 | tee sync.log

      - name: Send mail
        if: always() # Отправлять даже если скрипт упал с ошибкой
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Intercom Sync Report (${{ github.run_id }})
          to: immortal@jetmonsters.me
          from: GitHub Actions Sync
          body: |
            Синхронизация завершена. 
            Статус: ${{ job.status }}
            
            Логи выполнения прикреплены к письму.
          attachments: sync.log
