name: Sync ClickUp Changelog to Intercom

on:
  schedule:
    - cron: '0 0 * * 6'  # каждый день в 8:00 UTC
  workflow_dispatch:     # можно запускать вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests python-dotenv markdown
      
      - name: Run sync
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
        run: python clickup_to_intercom_changelog.py 4725328 8cjzjmb-30872
