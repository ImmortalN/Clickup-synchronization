name: Migrate Snippet to Guide

on:
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой в GitHub

jobs:
  run_migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Run migration script
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          INTERCOM_AUTHOR_ID: ${{ secrets.INTERCOM_AUTHOR_ID }}
          # Добавьте OWNER_ID если он используется в коде
          INTERCOM_OWNER_ID: ${{ secrets.INTERCOM_OWNER_ID }}
        run: python migrate_snippet_to_guide.py
